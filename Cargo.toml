[package]
name = "casement-jetkvm"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "JetKVM support for Casement: a Casement protocol plugin for JetKVM devices"
repository = "https://github.com/Inkbraid/casement-plugin-jetkvm"
publish = false

[lib]
name = "casement_jetkvm"
path = "src/lib.rs"

[[bin]]
name = "casement-jetkvm"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 4
