name: Release

# Pushing a tag like v0.1.0 builds and tests the plugin and publishes a
# release with the zip. GitHub adds the tag's source archives to every
# release, which keeps each binary next to its corresponding source as the
# GPL requires.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CASEMENT_E2E: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != crate version $version" }
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/fake-jetkvm/go.mod
          cache-dependency-path: tools/fake-jetkvm/go.sum
      - name: Build the fake JetKVM
        working-directory: tools/fake-jetkvm
        run: go build -o "${{ runner.temp }}/fake-jetkvm.exe" .
      - name: Media Foundation
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation
          }
      - run: cargo build --release
      - run: cargo test --release
        env:
          FAKE_JETKVM: ${{ runner.temp }}\fake-jetkvm.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/jetkvm | Out-Null
          Copy-Item target/release/casement-jetkvm.exe, plugin.json, icon.png, LICENSE, README.md, CHANGELOG.md dist/jetkvm/
          Compress-Archive -Path dist/jetkvm -DestinationPath "casement-jetkvm-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: casement-jetkvm-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
